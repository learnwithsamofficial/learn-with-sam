<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Real Numbers Practice | Learn With Sam</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #172554;
    color: white;
    text-align: center;
    padding: 20px 15px;
}

header h1 {
    margin: 0 0 6px;
    font-size: 25px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

main {
    max-width: 750px;
    margin: auto;
    padding: 18px;
}

.top-bar {
    background: white;
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.top-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    margin-bottom: 12px;
}

.timer {
    background: #fff1f1;
    color: #d63031;
    padding: 8px 12px;
    border-radius: 8px;
}

.progress-container {
    width: 100%;
    height: 10px;
    background: #e2e5ec;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 2.5%;
    background: #2563eb;
    border-radius: 20px;
    transition: width 0.3s;
}

.question-card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.level {
    display: inline-block;
    background: #eef2ff;
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 15px;
}

.question {
    font-size: 20px;
    line-height: 1.5;
    margin: 5px 0 20px;
}

.option {
    display: block !important;
    width: 100% !important;
    margin: 12px 0 !important;
    padding: 14px 16px !important;
    text-align: left !important;
    background: #f1f3f8;
    color: #222;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.4;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #e5e8f0;
}

.option.correct {
    background: #dff6e4;
    border: 2px solid #28a745;
    color: #176b2c;
}

.option.wrong {
    background: #ffe1e1;
    border: 2px solid #dc3545;
    color: #a51d2a;
}

.option:disabled {
    cursor: default;
}

.answer-message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    line-height: 1.5;
    display: none;
}

.answer-message.correct-msg {
    display: block;
    background: #e4f8e8;
    color: #176b2c;
}

.answer-message.wrong-msg {
    display: block;
    background: #ffe8e8;
    color: #a51d2a;
}

#nextBtn,
#restartBtn {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}

#nextBtn:hover,
#restartBtn:hover {
    background: #1d4ed8;
}

#finalResult {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

#finalResult h2 {
    text-align: center;
}

.result-score {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin: 20px 0;
}

.result-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.result-item {
    flex: 1;
    text-align: center;
    padding: 14px 8px;
    background: #f3f5fa;
    border-radius: 10px;
}

.result-item h3 {
    font-size: 15px;
    margin: 0 0 8px;
}

.result-item p {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
}

#finalMessage {
    text-align: center;
    line-height: 1.6;
}

.time-up {
    display: none;
    background: #ffe2e2;
    color: #b4232c;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

/* Answer Review */

#reviewSection {
    margin-top: 28px;
}

#reviewSection h2 {
    margin-bottom: 15px;
}

.review-card {
    background: #f5f7ff;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    border-left: 5px solid #dc3545;
}

.review-question {
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 10px;
}

.review-wrong {
    color: #b4232c;
    margin-bottom: 7px;
    line-height: 1.5;
}

.review-correct {
    color: #176b2c;
    font-weight: bold;
    margin-bottom: 7px;
    line-height: 1.5;
}

.review-explanation {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
    line-height: 1.6;
}

.perfect-score {
    background: #e3f9e7;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    text-align: center;
}

@media (max-width: 500px) {

    main {
        padding: 12px;
    }

    header h1 {
        font-size: 21px;
    }

    .question {
        font-size: 18px;
    }

    .result-box {
        gap: 6px;
    }

    .result-item {
        padding: 12px 5px;
    }

    .result-item p {
        font-size: 20px;
    }
}
</style>
</head>

    </div>


    <button id="restartBtn" onclick="location.reload()">

</div>

</main>

q:"√3 को अपरिमेय सिद्ध करने के लिए कौन-सी विधि उपयोगी है?",
options:[
"विरोधाभास विधि",
"मापन विधि",
"प्रतिशत विधि",
"औसत विधि"
],
answer:0,
level:"🔴 Level 4 - Most Important",
explanation:"√3 को परिमेय मानकर विरोधाभास प्राप्त किया जाता है। इसलिए विरोधाभास विधि से इसे अपरिमेय सिद्ध किया जाता है।"
},

{
q:"दो धनात्मक पूर्णांकों a और b के लिए सही संबंध कौन-सा है?",
options:[
"HCF + LCM = a×b",
"HCF × LCM = a×b",
"HCF - LCM = a×b",
"HCF ÷ LCM = a×b"
],
answer:1,
level:"🔴 Level 4 - Most Important",
explanation:"दो धनात्मक पूर्णांकों के लिए HCF × LCM = दोनों संख्याओं का गुणनफल।"
}

];


let currentQuestion = 0;
let score = 0;
let answered = false;

let timeLeft = 40 * 60;
let timerInterval;

let wrongQuestions = [];


function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `प्रश्न ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("level").textContent = q.level;

    document.getElementById("question").textContent = q.q;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) + ". " + option;

        button.onclick = function() {
            checkAnswer(button, index);
        };

        optionsDiv.appendChild(button);

    });


    const message = document.getElementById("answerMessage");

    message.textContent = "";

    message.className = "answer-message";


    document.getElementById("nextBtn").style.display = "none";


    updateProgress();

}


function checkAnswer(button, selectedIndex) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(btn => {
        btn.disabled = true;
    });


    if (selectedIndex === q.answer) {

        button.classList.add("correct");

        score++;

        const message =
            document.getElementById("answerMessage");

        message.textContent =
            "✅ सही उत्तर! बहुत बढ़िया।";

        message.className =
            "answer-message correct-msg";

    } else {

        button.classList.add("wrong");

        allOptions[q.answer].classList.add("correct");


        const message =
            document.getElementById("answerMessage");

        message.textContent =
            "❌ गलत उत्तर! सही उत्तर: " +
            q.options[q.answer];

        message.className =
            "answer-message wrong-msg";


        wrongQuestions.push({

            question: q.q,

            selected:
                q.options[selectedIndex],

            correct:
                q.options[q.answer],

            explanation:
                q.explanation

        });

    }


    document.getElementById("nextBtn").style.display =
        "block";

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        finishQuiz();

    }

}


function updateProgress() {

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";

}


function startTimer() {

    timerInterval = setInterval(function() {

        timeLeft--;

        let minutes =
            Math.floor(timeLeft / 60);

        let seconds =
            timeLeft % 60;

        seconds =
            seconds < 10 ? "0" + seconds : seconds;


        document.getElementById("timer").textContent =
            `⏱️ ${minutes}:${seconds}`;


        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            document.getElementById("timeUp").style.display =
                "block";

            finishQuiz();

        }

    }, 1000);

}


function finishQuiz() {

    clearInterval(timerInterval);

    document.getElementById("quizArea").style.display =
        "none";

    document.getElementById("finalResult").style.display =
        "block";


    const total = questions.length;

    const wrong = total - score;

    const percentage =
        Math.round((score / total) * 100);


    document.getElementById("finalScore").textContent =
        `${score} / ${total}`;

    document.getElementById("correctCount").textContent =
        score;

    document.getElementById("wrongCount").textContent =
        wrong;

    document.getElementById("percentage").textContent =
        percentage + "%";


    let finalMessage = "";


    if (percentage >= 90) {

        finalMessage =
            "🔥 Excellent! Real Numbers chapter par tumhari preparation bahut strong hai.";

    } else if (percentage >= 75) {

        finalMessage =
            "👏 Very Good! Thodi aur practice se tum aur better score kar sakte ho.";

    } else if (percentage >= 50) {

        finalMessage =
            "👍 Good attempt! Jo questions galat hue hain unhe dobara revise karo.";

    } else {

        finalMessage =
            "📚 Chapter ko ek baar aur revise karo aur phir test dobara do.";

    }


    document.getElementById("finalMessage").textContent =
        finalMessage;


    showWrongAnswers();


    document.getElementById("restartBtn").style.display =
        "block";

}


function showWrongAnswers() {

    const container =
        document.getElementById("wrongAnswers");

    container.innerHTML = "";


    if (wrongQuestions.length === 0) {

        container.innerHTML = `
            <div class="perfect-score">
                🎉 Perfect Score!<br>
                सभी questions सही हैं। Excellent! 🔥
            </div>
        `;

        return;

    }


    wrongQuestions.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className = "review-card";


        card.innerHTML = `

            <div class="review-question">
                ${index + 1}. ${item.question}
            </div>

            <div class="review-wrong">
                ❌ आपका उत्तर: ${item.selected}
            </div>

            <div class="review-correct">
                ✅ सही उत्तर: ${item.correct}
            </div>

            <div class="review-explanation">
                💡 <b>Explanation:</b><br>
                ${item.explanation}
            </div>

        `;


        container.appendChild(card);

    });

}


loadQuestion();

startTimer();

</script>
