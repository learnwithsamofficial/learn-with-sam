<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Timer | Learn With Sam</title>

<meta name="description" content="Free study timer for students to track daily and total study time on Learn With Sam.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://learnwithsamofficial.github.io/learn-with-sam/study-timer.html">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #172554;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    margin: 0 0 6px;
    font-size: 26px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

main {
    max-width: 650px;
    margin: auto;
    padding: 20px 15px;
}

.timer-card {
    background: white;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.timer-label {
    font-size: 17px;
    color: #666;
    margin-bottom: 10px;
}

.timer {
    font-size: 55px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 15px 0 25px;
}

.status {
    font-size: 15px;
    margin-bottom: 20px;
    color: #666;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#startBtn {
    background: #2563eb;
    color: white;
}

#pauseBtn {
    background: #f59e0b;
    color: white;
}

#resetBtn {
    background: #e5e7eb;
    color: #222;
}

button:active {
    transform: scale(0.97);
}

.stats {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat-card {
    background: white;
    padding: 18px 10px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.stat-card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #666;
}

.stat-card p {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
}

.info {
    margin-top: 18px;
    background: #eef2ff;
    padding: 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
}

@media (max-width: 500px) {

    .timer {
        font-size: 45px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>
    <h1>⏱️ Study Timer</h1>
    <p>Focus on your study • Learn With Sam</p>
</header>

<main>

    <div class="timer-card">

        <div class="timer-label">
            📚 Study Session
        </div>

        <div class="timer" id="timer">
            00:00:00
        </div>

        <div class="status" id="status">
            Ready to study 🚀
        </div>

        <div class="buttons">

            <button id="startBtn" onclick="startTimer()">
                ▶️ Start
            </button>

            <button id="pauseBtn" onclick="pauseTimer()">
                ⏸️ Pause
            </button>

            <button id="resetBtn" onclick="resetTimer()">
                🔄 Reset
            </button>

        </div>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>📅 Today's Study</h3>
            <p id="todayTime">0m</p>
        </div>

        <div class="stat-card">
            <h3>🏆 Total Study</h3>
            <p id="totalTime">0m</p>
        </div>

    </div>

    <div class="info">
        💡 <b>Tip:</b> Timer Start karke phone side mein rakho aur
        bina distraction ke study karo. Tumhara study time automatically save hota rahega.
    </div>

</main>

<!-- @ts-nocheck -->

<script>

let seconds = 0;
let interval = null;
let isRunning = false;


/* Saved study data */

let todayStudy =
    Number(localStorage.getItem("todayStudy")) || 0;

let totalStudy =
    Number(localStorage.getItem("totalStudy")) || 0;


/* Check today's date */

let savedDate =
    localStorage.getItem("studyDate");

let today =
    new Date().toDateString();


if (savedDate !== today) {

    todayStudy = 0;

    localStorage.setItem("todayStudy", "0");

    localStorage.setItem(
        "studyDate",
        today
    );
}


/* Display timer */

function updateTimer() {

    let hours =
        Math.floor(seconds / 3600);

    let minutes =
        Math.floor((seconds % 3600) / 60);

    let secs =
        seconds % 60;


    if (hours < 10) {
        hours = "0" + hours;
    }

    if (minutes < 10) {
        minutes = "0" + minutes;
    }

    if (secs < 10) {
        secs = "0" + secs;
    }


    document.getElementById("timer").textContent =
        hours + ":" + minutes + ":" + secs;
}


/* Start timer */

function startTimer() {

    if (isRunning) {
        return;
    }

    isRunning = true;


    document.getElementById("status").textContent =
        "🔥 Study session running... Focus!";


    interval = setInterval(function() {

        seconds++;

        todayStudy++;
        totalStudy++;


        updateTimer();
        updateStats();


        localStorage.setItem(
            "todayStudy",
            String(todayStudy)
        );

        localStorage.setItem(
            "totalStudy",
            String(totalStudy)
        );

        localStorage.setItem(
            "studyDate",
            today
        );

    }, 1000);
}


/* Pause timer */

function pauseTimer() {

    if (!isRunning) {
        return;
    }


    clearInterval(interval);

    interval = null;

    isRunning = false;


    document.getElementById("status").textContent =
        "⏸️ Study paused";
}


/* Reset current session */

function resetTimer() {

    clearInterval(interval);

    interval = null;

    isRunning = false;

    seconds = 0;


    updateTimer();


    document.getElementById("status").textContent =
        "Ready to study 🚀";
}


/* Format study time */
/**
 * @param {number} totalSeconds
 */
function formatTime(totalSeconds) {

    let hours =
        Math.floor(totalSeconds / 3600);

    let minutes =
        Math.floor((totalSeconds % 3600) / 60);


    if (hours > 0) {

        return hours + "h " + minutes + "m";

    }


    return minutes + "m";
}


/* Update statistics */

function updateStats() {

    document.getElementById("todayTime").textContent =
        formatTime(todayStudy);

    document.getElementById("totalTime").textContent =
        formatTime(totalStudy);
}


/* Initial display */

updateTimer();

updateStats();

</script>

</body>
</html>
